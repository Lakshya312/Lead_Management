{% extends 'base.html' %}

{% block title %}Confirm Delete — LeadManager CRM{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; justify-content:center; min-height:60vh;">
    <div class="card-crm" style="max-width:480px; width:100%; text-align:center; padding:48px 40px;">
        <div style="width:72px;height:72px;background:rgba(255,101,132,0.15);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#FF6584;margin:0 auto 24px;">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <h1 style="font-size:1.4rem; font-weight:700; color:var(--text); margin-bottom:10px;">
            Delete {{ object_type }}?
        </h1>

        <p style="color:var(--text-muted); font-size:0.92rem; line-height:1.6; margin-bottom:32px;">
            You are about to permanently delete
            <strong style="color:var(--accent);">"{{ object_name }}"</strong>.
            <br>This action <strong>cannot be undone</strong>.
        </p>

        <form method="post" style="display:inline;">
            {% csrf_token %}
            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
                <a href="{{ cancel_url }}" class="btn-ghost-crm" style="flex:1; justify-content:center; padding:12px;">
                    <i class="bi bi-x-lg"></i> Cancel
                </a>
                <button type="submit" class="btn-danger-crm" style="flex:1; justify-content:center; padding:12px; font-size:0.9rem;">
                    <i class="bi bi-trash-fill"></i> Yes, Delete
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
